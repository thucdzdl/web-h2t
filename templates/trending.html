<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thịnh hành - H2T Music</title>
    <link rel="icon" type="image/png" href="logo.png?v=1.1">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .song-row { cursor: pointer; transition: 0.2s; }
        .song-row:hover { background: rgba(255, 255, 255, 0.1); }
        .user-actions { display: flex; align-items: center; justify-content: flex-end; gap: 20px; }
        .volume-area { display: flex; align-items: center; gap: 12px; justify-content: flex-end; }
        .volume-area i { font-size: 16px; color: #b3b3b3; cursor: pointer; transition: 0.2s; width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; margin: 0 !important; }
        .volume-area i:hover { color: #fff; transform: scale(1.1); }
        .volume-area input[type="range"] { width: 100px; cursor: pointer; margin-left: 4px; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <img src="logo.png" alt="Logo">
                <span>H2T Music</span>
            </div>
            <nav class="menu-group">
                <p class="label">KHÁM PHÁ</p>
                <ul class="nav-list">
                    <li><a href="index.html"><i class="fas fa-home"></i><span>Trang chủ</span></a></li>
                    <li class="active"><a href="trending.html"><i class="fas fa-bolt"></i><span>Thịnh hành</span></a></li>
                    <li><a href="library.html"><i class="fas fa-layer-group"></i><span>Thư viện</span></a></li>
                </ul>
            </nav>
            <nav class="menu-group">
                <p class="label">CÁ NHÂN</p>
                <ul>
                    <li><a href="favorites.html"><i class="fas fa-heart"></i> Yêu thích</a></li>
                    <li><a href="history.html"><i class="fas fa-history"></i> Nghe gần đây</a></li>
                    <li><a href="playlist.html"><i class="fas fa-plus-circle"></i> Playlist</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="search-container">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Bạn muốn nghe gì?">
                    </div>
                </div>
                
                <div class="user-actions">
                    <div class="notification-wrapper">
                        <button class="notif-btn">
                            <i class="far fa-bell icon-btn" style="position: relative;">
                                <span class="badge" style="position: absolute; top: -8px; right: -8px; background: red; color: white; border-radius: 50%; padding: 2px 5px; font-size: 10px;">3</span>
                            </i>
                        </button>
                    </div>
                    <a href="/community" style="color: inherit;"><i class="fas fa-users icon-btn"></i></a>
                    <div class="auth-buttons" id="auth-section">
                        <a href="login.html" class="btn-login" style="background: white; color: black; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: bold;">Đăng nhập</a>
                    </div>
                </div>
            </header>

            <section class="trending-banner">
                <div class="trending-icon-box">
                    <i class="fas fa-bolt"></i>
                </div>
                <div class="banner-info">
                    <span class="tag-label">PLAYLIST</span>
                    <h1>Thịnh hành</h1>
                    <p>Những bài hát đang làm mưa làm gió trên H2T Music tuần này.</p>
                </div>
            </section>

            <div class="list-container" style="padding: 0 30px 150px 30px;">
                <div style="display: flex; padding: 10px 15px; border-bottom: 1px solid #282828; color: #b3b3b3; font-size: 13px; font-weight: bold; text-transform: uppercase; margin-bottom: 10px;">
                    <div style="width: 5%; text-align: center;">#</div>
                    <div style="width: 45%;">Tiêu đề</div>
                    <div style="width: 30%;">Nghệ sĩ</div>
                    <div style="width: 20%; display: flex; justify-content: flex-end; padding-right: 15px;">
                        <i class="far fa-clock" style="font-size: 16px;"></i>
                    </div>
                </div>
                <div id="trending-list"></div>
            </div>
        </main>

        <aside class="right-sidebar">
            <h3>Tiếp theo</h3>
            <div class="queue">
                <div id="queue-list"></div>
            </div>
        </aside>
    </div>

    <footer class="player-bar">
        <div class="current-song">
            <div class="disk-wrapper">
                <img src="" id="current-img" class="spinning" style="display: none;">
            </div>
            <div class="song-meta">
               <h4 id="current-name">Chưa có bài hát</h4>
                <p id="current-artist">H2T Music</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="buttons">
                <i class="fas fa-random"></i>
                <i class="fas fa-step-backward"></i>
                <i class="fas fa-play-circle" id="master-play" style="font-size: 32px; margin: 0 15px;"></i>
                <i class="fas fa-step-forward"></i>
                <i class="fas fa-redo"></i>
            </div>
            <div class="progress-area" id="progress-container"> 
                <span id="current-time">0:00</span> 
                <div class="bar-bg">
                    <div class="bar-fill" id="progress-bar" style="width: 0%;"></div> 
                </div>
                <span id="duration">0:00</span> 
            </div>
        </div>

        <div class="volume-area">
            <i class="fas fa-microphone-alt"></i>
            <i class="fas fa-list-ul"></i>
            <i class="fas fa-arrow-alt-circle-down download-btn-player"></i>
            <i class="fas fa-volume-up" id="volume-icon"></i>
            <input type="range" min="0" max="100" value="70" id="volume-slider">
        </div>
        <audio id="main-audio" style="display: none;"></audio>
    </footer>

    <script>
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            let min = Math.floor(seconds / 60);
            let sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' + sec : sec}`;
        }

        // Tải danh sách nhạc từ API
        async function loadTrendingSongs() {
            const container = document.getElementById('trending-list');
            if (!container) return;
            container.innerHTML = '<p style="color: white; text-align: center;">Đang tải nhạc...</p>';

            try {
                const response = await fetch(`http://thucpham111-001-site1.stempurl.com/api/youtubemusic/trending`);
                if (!response.ok) throw new Error(`Lỗi: ${response.status}`);
                const songs = await response.json();
                veGiaoDienVip(songs); 
            } catch (error) {
                container.innerHTML = `<p style="color: red; text-align: center;">Lỗi API: ${error.message}</p>`;
            }
        }

        // Vẽ giao diện xịn (Tên hàm độc quyền tránh xung đột)
        // Vẽ giao diện xịn (Đã fix lỗi thời gian 04:15)
        function veGiaoDienVip(songs) {
            const container = document.getElementById('trending-list');
            container.innerHTML = ''; 
            songs.forEach((song, index) => {
                const safeTitle = song.title.replace(/'/g, ""); 
                const safeArtist = song.artist.replace(/'/g, "");
                
                // Lấy thời gian thật từ API, nếu không có thì để --:--
                const timeStr = song.duration ? song.duration : "--:--";

                const html = `
                    <div class="song-row" style="display: flex; align-items: center; padding: 12px 15px; border-radius: 8px; cursor: pointer; color: #b3b3b3; margin-bottom: 5px;" 
                         onclick="getStreamAndPlay('${song.id}', '${safeTitle}', '${safeArtist}', '${song.thumbnail}')">
                        
                        <div style="width: 5%; text-align: center;">${index + 1}</div>
                        <div style="width: 45%; display: flex; align-items: center; gap: 15px;">
                            <img src="${song.thumbnail}" style="width: 45px; height: 45px; border-radius: 5px; object-fit: cover;">
                            <span style="color: white; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px;">
                                ${song.title}
                            </span>
                        </div>
                        <div style="width: 30%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${song.artist}</div>
                        <div style="width: 20%; display: flex; justify-content: space-between; padding-right: 15px;">
                            <i class="far fa-heart" onclick="toggleFavoriteSong(event, '${song.id}', '${safeTitle}', '${safeArtist}', '${song.thumbnail}')"></i>
                            <span>${timeStr}</span>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        // Gọi API lấy luồng Audio và phát
        async function getStreamAndPlay(videoId, title, artist, thumbnail) {
            document.getElementById('current-name').innerText = title;
            document.getElementById('current-artist').innerText = artist;
            document.getElementById('current-img').src = thumbnail;
            document.getElementById('current-img').style.display = 'block';

            const audioPlayer = document.getElementById('main-audio');
            const playBtn = document.getElementById('master-play');

            try {
                const response = await fetch(`http://thucpham111-001-site1.stempurl.com/api/youtubemusic/play/${videoId}`);
                if (!response.ok) throw new Error("Nhạc bị đánh bản quyền YouTube!");

                const data = await response.json();
                if (data.streamUrl && data.streamUrl !== "null") {
                    audioPlayer.src = `http://thucpham111-001-site1.stempurl.com/api/youtubemusic/download/${videoId}`;
                    audioPlayer.play();
                    playBtn.className = 'fas fa-pause-circle';
                } else {
                    alert("Không tải được luồng nhạc!");
                }
            } catch (error) {
                alert("Lỗi: " + error.message);
            }
        }

       // HÀM XỬ LÝ THẢ TIM (BẢN MÁY QUÉT RADAR BẤT BẠI)
        async function toggleFavoriteSong(event, videoId, title, artist, thumbnail) {
            event.stopPropagation();
            const heartIcon = event.target;
            heartIcon.style.color = "#888"; 

            try {
                // --- MÁY QUÉT RADAR TÌM USER ---
                let currentUser = null;
                for (let i = 0; i < localStorage.length; i++) {
                    let key = localStorage.key(i);
                    let val = localStorage.getItem(key);
                    
                    // Nếu auth.js lưu dạng JSON có chứa email
                    if (val && val.includes('email') && val.startsWith('{')) {
                        try {
                            let parsed = JSON.parse(val);
                            if (parsed.name || parsed.username || parsed.email) {
                                currentUser = parsed.name || parsed.username || parsed.email;
                                break;
                            }
                        } catch(e) {}
                    } 
                    // Nếu lưu dạng chữ bình thường
                    else if (key.toLowerCase().includes('user')) {
                        currentUser = val;
                        break;
                    }
                }

                if (!currentUser) {
                    alert("Bạn cần đăng nhập để lưu bài hát nhé!");
                    heartIcon.style.color = "white"; 
                    return;
                }

                // Gửi tên currentUser lên Server
                const response = await fetch('http://thucpham111-001-site1.stempurl.com/api/favorites/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ videoId, title, artist, thumbnail, username: currentUser })
                });

                if (!response.ok) throw new Error("API Backend báo lỗi!");
                const data = await response.json();

                if (data.isFavorited === true) {
                    heartIcon.className = "fas fa-heart";
                    heartIcon.style.color = "#1db954"; 
                } else {
                    heartIcon.className = "far fa-heart";
                    heartIcon.style.color = "white"; 
                }
            } catch (error) {
                console.error("Lỗi:", error);
                alert("Lỗi kết nối Backend, không thể thả tim lúc này!");
                heartIcon.style.color = "white";
            }
        }

        // Các sự kiện Play/Pause và Thanh thời gian
        document.addEventListener("DOMContentLoaded", function() {
            loadTrendingSongs(); 

            const audio = document.getElementById('main-audio');
            const playBtnIcon = document.getElementById('master-play');
            const progressFill = document.getElementById('progress-bar');
            const currentTimeText = document.getElementById('current-time');
            const totalTimeText = document.getElementById('duration');

            if (playBtnIcon && audio) {
                playBtnIcon.style.cursor = 'pointer';
                playBtnIcon.addEventListener('click', () => {
                    if (audio.paused && audio.src) {
                        audio.play();
                        playBtnIcon.className = "fas fa-pause-circle"; 
                    } else if (!audio.paused) {
                        audio.pause();
                        playBtnIcon.className = "fas fa-play-circle"; 
                    }
                });
            }

            if (audio) {
                audio.addEventListener('timeupdate', () => {
                    currentTimeText.innerText = formatTime(audio.currentTime);
                    if (audio.duration && !isNaN(audio.duration)) {
                        progressFill.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
                        totalTimeText.innerText = formatTime(audio.duration);
                    }
                });
                audio.addEventListener('ended', () => {
                    playBtnIcon.className = "fas fa-play-circle";
                    progressFill.style.width = '0%';
                });
            }
        });
    </script>
    
    <script src="auth.js?version=final"></script>
</body>
</html>
