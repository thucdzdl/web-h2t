<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao dịch thành công - H2T Music</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0b; /* Nền tối sang trọng */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .success-wrapper {
            width: 100%;
            max-width: 420px;
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
            box-sizing: border-box;
            /* Thêm hiệu ứng xuất hiện nhẹ nhàng cho cả hộp */
            animation: fadeInPage 0.4s ease-out forwards;
        }

        @keyframes fadeInPage {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Hiệu ứng vòng tròn tích xanh chuyển động */
        .success-icon {
            width: 90px;
            height: 90px;
            background-color: #1DB954;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            margin: 0 auto 25px;
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            margin: 0 0 10px;
            color: #000;
        }

        p {
            font-size: 15px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Hộp chi tiết giao dịch */
        .receipt-card {
            background-color: #f4f4f4;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 35px;
            text-align: left;
        }

        .receipt-item {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 10px;
            color: #333;
        }

        .receipt-item:last-child {
            margin-bottom: 0;
        }

        .receipt-item.total {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            font-weight: 900;
            font-size: 16px;
            color: #000;
        }

        /* NÚT BẮT ĐẦU NGHE NHẠC - ĐÃ CĂN GIỮA TRIỆT ĐỂ */
        .btn-start {
            display: flex;          /* Sử dụng Flexbox */
            justify-content: center; /* Căn giữa chữ theo chiều ngang */
            align-items: center;     /* Căn giữa chữ theo chiều dọc */
            
            width: 100%;
            height: 55px;            /* Cố định chiều cao để căn dọc chuẩn hơn */
            background-color: #1DB954;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-start:hover {
            background-color: #1ed760;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(29, 185, 84, 0.4);
        }

        .btn-start:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="success-wrapper">
    <div class="success-icon">
        <i class="fas fa-check"></i>
    </div>

    <h1>Thanh toán thành công!</h1>
    <p>Gói <strong>H2T Premium</strong> của bạn đã sẵn sàng. Hãy tận hưởng trải nghiệm nghe nhạc đỉnh cao ngay bây giờ.</p>

    <div class="receipt-card">
        <div class="receipt-item">
            <span>Mã hóa đơn:</span>
            <strong>#H2T-8899Z</strong>
        </div>
        <div class="receipt-item">
            <span>Hình thức:</span>
            <span>Thẻ tín dụng / MoMo</span>
        </div>
        <div class="receipt-item">
            <span>Thời gian:</span>
            <span id="invoice-time">--/--/---- --:--</span>
        </div>
    </div>

    <a href="index.html" class="btn-start">
        Bắt đầu nghe nhạc
    </a>
</div>

<script>
    // Tự động cập nhật thời gian hiện tại vào hóa đơn khi trang được tải
    window.addEventListener('DOMContentLoaded', () => {
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        
        const formattedTime = `${day}/${month}/${year} ${hours}:${minutes}`;
        document.getElementById('invoice-time').innerText = formattedTime;
        
    });
</script>


</body>
</html>
