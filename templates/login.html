<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - H2T Music</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-logo">
            <img src="logo.png" alt="Logo">
            <h1>H2T Music</h1>
        </div>
        <form class="auth-form" id="loginForm">
            <h2>Đăng nhập để bắt đầu nghe</h2>
            <div class="input-group">
                <label>Email đăng nhập</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập" required>
            </div>
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="Mật khẩu" required>
            </div>
            <button type="submit" class="btn-auth">Đăng nhập</button>
        </form>
        <div class="auth-footer">
            <p>Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
        </div>
    </div>
   <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        
        const requestData = {
            Username: document.getElementById('username').value,
            Email: document.getElementById('username').value, 
            Password: document.getElementById('password').value
        };

        try {
            const response = await fetch('http://thucpham111-001-site1.stempurl.com/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestData)
            });

            if (response.ok) {
                const userData = await response.json();
                
                // Lưu thông tin người dùng vào LocalStorage
                localStorage.setItem('h2t_user', JSON.stringify(userData));
                
                // === BẮT ĐẦU PHÂN LUỒNG QUYỀN (RBAC) ===
                // Lấy Role từ C# trả về (Dự phòng cả trường hợp chữ hoa 'Role' và chữ thường 'role')
                const userRole = userData.role || userData.Role;

                if (userRole === "Admin") {
                    alert("Đăng nhập thành công! Chào sếp.");
                    window.location.href = 'admin_dashboard.html'; // Admin -> Vào trang quản trị
                } else {
                    alert("Đăng nhập thành công! Chúc bạn nghe nhạc vui vẻ.");
                    window.location.href = 'index.html'; // Khách/User -> Vào trang chủ
                }
                // === KẾT THÚC PHÂN LUỒNG ===

            } else {
                // Sửa lỗi JSON parse khi API trả về text không phải JSON
                const errorText = await response.text();
                
                // 👉 DÒNG MỚI CHÈN VÀO ĐÂY NÈ:
                console.error("Chi tiết lỗi từ C#:", errorText); 
                
                // Cập nhật lại thông báo để nhắc mình mở F12
                alert("Đăng nhập thất bại. Hãy mở F12 -> Console để xem chi tiết nhé!");
            }
        } catch (error) {
            console.error("Lỗi:", error);
            alert("Không thể kết nối đến máy chủ.");
        }
    });
</script>
</body>
</html>
