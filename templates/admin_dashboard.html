<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - H2T Music</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #121212; color: white; display: flex; height: 100vh; }
        /* Sidebar Admin */
        .admin-sidebar { width: 250px; background-color: #000000; padding: 20px 0; display: flex; flex-direction: column; }
        .admin-logo { text-align: center; margin-bottom: 30px; font-size: 24px; font-weight: bold; color: #1db954; }
        .admin-menu { list-style: none; padding: 0; margin: 0; }
        .admin-menu li { padding: 15px 25px; border-left: 4px solid transparent; cursor: pointer; transition: 0.3s; }
        .admin-menu li:hover, .admin-menu li.active { background-color: #282828; border-left: 4px solid #1db954; color: #1db954; }
        .admin-menu li a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 15px; font-size: 16px; }
        
        /* Main Content */
        .admin-content { flex: 1; padding: 30px; background-color: #121212; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .header h1 { margin: 0; font-size: 28px; }
        .admin-profile { display: flex; align-items: center; gap: 10px; background: #282828; padding: 8px 15px; border-radius: 20px; }

        /* Dashboard Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #181818; padding: 20px; border-radius: 10px; border: 1px solid #282828; display: flex; align-items: center; justify-content: space-between; }
        .stat-info h3 { margin: 0; font-size: 14px; color: #b3b3b3; text-transform: uppercase; }
        .stat-info p { margin: 10px 0 0 0; font-size: 28px; font-weight: bold; color: white; }
        .stat-icon { width: 50px; height: 50px; border-radius: 50%; background: rgba(29, 185, 84, 0.2); color: #1db954; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    </style>
</head>
<head>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Lấy thông tin user từ LocalStorage
            const userJson = localStorage.getItem("h2t_user");
            
            // 1. Chưa đăng nhập -> Đá về trang đăng nhập
            if (!userJson) {
                window.location.href = "login.html";
                return;
            }

            // 2. Đã đăng nhập nhưng không phải Admin -> Đá về Trang chủ
            const user = JSON.parse(userJson);
            const userRole = user.role || user.Role;
            
            if (userRole !== "Admin") {
                alert("Cảnh báo: Bạn không có quyền truy cập khu vực Quản trị!");
                window.location.href = "index.html"; 
            }
        });
    </script>
</head>
<body>
    <div class="admin-sidebar">
        <div class="admin-logo">H2T ADMIN</div>
       <ul class="admin-menu">
            <li><a href="admin_dashboard.html"><i class="fas fa-home"></i> Tổng quan</a></li>
            <li><a href="manage_songs.html"><i class="fas fa-music"></i> Quản lý Bài hát</a></li>
            <li><a href="manage_users.html"><i class="fas fa-users"></i> Quản lý User</a></li>
            <li><a href="manage_premium.html"><i class="fas fa-wallet"></i> Quản lý Giao dịch</a></li>
            <li style="margin-top: auto; border-top: 1px solid #333;"><a href="index.html"><i class="fas fa-sign-out-alt"></i> Về trang Web</a></li>
        </ul>
    </div>

    <div class="admin-content">
        <div class="header">
            <h1>Dashboard Thống Kê</h1>
            <div class="admin-profile">
                <i class="fas fa-user-shield" style="color: #1db954;"></i>
                <span>Admin H2T</span>
            </div>
        </div>

       <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-info"><h3>Tổng Người Dùng</h3><p id="total-users-count">...</p></div>
                <div class="stat-icon"><i class="fas fa-users"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info"><h3>Tổng Bài Hát</h3><p id="total-songs-count">...</p></div>
                <div class="stat-icon"><i class="fas fa-music"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info"><h3>Doanh Thu Premium</h3><p id="total-revenue-count">...</p></div>
                <div class="stat-icon"><i class="fas fa-crown"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info"><h3>Lượt Nghe Hôm Nay</h3><p>8,302</p></div>
                <div class="stat-icon"><i class="fas fa-headphones"></i></div>
            </div>
        </div>
        
        <p style="color: #b3b3b3;">Biểu đồ chi tiết đang được cập nhật...</p>
    </div>
    <script>
        // Gọi API lên Backend C# khi trang vừa load xong
        document.addEventListener("DOMContentLoaded", async function() {
            try {
                // Đã điền sẵn cổng 5043 chuẩn xác của Giám đốc
                const response = await fetch('http://thucpham111-001-site1.stempurl.com/api/admin/dashboard-stats');
                if (response.ok) {
                    const data = await response.json();
                    
                    // Đổ dữ liệu thật từ C# vào các thẻ HTML đã gắn ID ở trên
                    document.getElementById('total-users-count').innerText = data.totalUsers.toLocaleString();
                    document.getElementById('total-songs-count').innerText = data.totalSongs.toLocaleString();
                    document.getElementById('total-revenue-count').innerText = data.totalRevenue.toLocaleString() + ' ₫';
                }
            } catch (error) {
                console.error("Lỗi khi tải dữ liệu thống kê:", error);
            }
        });
    </script>
</body>
</html>
