<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Bài Hát - H2T Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #121212; color: white; display: flex; height: 100vh; }
        .admin-sidebar { width: 250px; background-color: #000000; padding: 20px 0; display: flex; flex-direction: column; }
        .admin-logo { text-align: center; margin-bottom: 30px; font-size: 24px; font-weight: bold; color: #1db954; }
        .admin-menu { list-style: none; padding: 0; margin: 0; }
        .admin-menu li { padding: 15px 25px; border-left: 4px solid transparent; cursor: pointer; transition: 0.3s; }
        .admin-menu li:hover, .admin-menu li.active { background-color: #282828; border-left: 4px solid #1db954; color: #1db954; }
        .admin-menu li a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 15px; font-size: 16px; }
        
        .admin-content { flex: 1; padding: 30px; background-color: #121212; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        
        /* Table Styles */
        .table-container { background: #181818; border-radius: 10px; padding: 20px; }
        .table-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add { background: #1db954; color: black; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-add:hover { background: #1ed760; transform: scale(1.05); }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: #b3b3b3; font-weight: normal; border-bottom: 1px solid #333; padding: 12px; }
        td { padding: 15px 12px; border-bottom: 1px solid #282828; }
        tr:hover td { background-color: #2a2a2a; }
        
        .song-info { display: flex; align-items: center; gap: 15px; }
        .song-img { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; }
        
        /* Action Buttons (Sửa/Xóa) */
        .action-btns button { background: transparent; border: none; color: #b3b3b3; cursor: pointer; font-size: 16px; margin-right: 10px; transition: 0.3s; }
        .action-btns button.btn-edit:hover { color: #3498db; }
        .action-btns button.btn-delete:hover { color: #e74c3c; }
        /* Popup Thêm Bài Hát */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: #181818; width: 400px; padding: 25px; border-radius: 10px; border: 1px solid #333; position: relative; }
        .modal-content h2 { margin-top: 0; margin-bottom: 20px; font-size: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #b3b3b3; font-size: 13px; }
        .form-group input { width: 100%; padding: 10px; background: #282828; border: 1px solid #444; border-radius: 5px; color: white; outline: none; box-sizing: border-box; }
        .form-group input:focus { border-color: #1db954; }
        .btn-submit { width: 100%; padding: 12px; background: #1db954; border: none; border-radius: 20px; color: black; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #1ed760; transform: scale(1.02); }
        .close-btn { position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: #b3b3b3; font-size: 20px; cursor: pointer; }
        .close-btn:hover { color: white; }
    </style>
</head>
<body>
    <div class="admin-sidebar">
        <div class="admin-logo">H2T ADMIN</div>
        <ul class="admin-menu">
            <li><a href="admin_dashboard.html"><i class="fas fa-home"></i> Tổng quan</a></li>
            <li><a href="manage_songs.html"><i class="fas fa-music"></i> Quản lý Bài hát</a></li>
            <li><a href="manage_users.html"><i class="fas fa-users"></i> Quản lý User</a></li>
            <li><a href="manage_premium.html"><i class="fas fa-wallet"></i> Quản lý Giao dịch</a></li>
            <li style="margin-top: auto; border-top: 1px solid #333;"><a href="index.html"><i class="fas fa-sign-out-alt"></i> Về trang Web</a></li>
        </ul>
    </div>

    <div class="admin-content">
        <div class="header">
            <h1 style="margin: 0; font-size: 28px;">Kho Nhạc H2T</h1>
        </div>

        <div class="table-container">
            <div class="table-header-bar">
                <h3 style="margin: 0;">Danh sách Bài hát</h3>
                <button style="background-color: #1db954; color: black; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer;" onclick="openAddModal()">
    <i class="fas fa-plus"></i> Thêm Bài Hát Mới
</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>#ID</th>
                        <th>BÀI HÁT</th>
                        <th>LƯỢT NGHE</th>
                        <th>NGÀY THÊM</th>
                        <th>HÀNH ĐỘNG</th>
                    </tr>
                </thead>
                <tbody id="song-table-body">
                    
                </tbody>
            </table>
        </div>
    </div>
    <script>
        // 1. GỌI API LẤY DANH SÁCH BÀI HÁT
        document.addEventListener("DOMContentLoaded", async function() {
            const tableBody = document.getElementById("song-table-body");
            if (!tableBody) return;

            tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px;">Đang tải danh sách nhạc...</td></tr>';

            try {
                const response = await fetch('http://thucpham111-001-site1.stempurl.com/api/admin/songs'); 
                if (response.ok) {
                    const songs = await response.json();
                    tableBody.innerHTML = ''; 

                    if (songs.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px;">Kho nhạc đang trống!</td></tr>';
                        return;
                    }

                    songs.forEach((song, index) => {
                        // Dựa vào Model Song.cs của bạn có các trường: Id, Title, AudioUrl, Genre...
                        const row = `
                            <tr>
                                <td>${song.id}</td>
                                <td>
                                    <div class="song-info">
                                        <div class="song-img" style="background-color: #1db954; display: flex; align-items: center; justify-content: center; color: black;"><i class="fas fa-music"></i></div>
                                        <div>
                                            <div style="font-weight: bold; color: white;">${song.title}</div>
                                            <div style="font-size: 13px; color: #b3b3b3;">${song.genre || 'Chưa cập nhật'}</div>
                                        </div>
                                    </div>
                                </td>
                                <td><i class="fas fa-link" style="color:#b3b3b3;" title="${song.audioUrl}"></i> URL</td>
                                <td>Hệ thống</td>
                                <td class="action-btns">
                                    <button class="btn-edit" title="Chỉnh sửa (Bản Demo)"><i class="fas fa-edit"></i></button>
                                    <button class="btn-delete" onclick="deleteSong(${song.id})" title="Xóa"><i class="fas fa-trash"></i></button>
                                </td>
                            </tr>
                        `;
                        tableBody.insertAdjacentHTML('beforeend', row);
                    });
                }
            } catch (error) {
                console.error("Lỗi:", error);
                tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: #e74c3c;">Lỗi kết nối Backend!</td></tr>';
            }
        });

        // 2. HÀM XÓA BÀI HÁT
        async function deleteSong(songId) {
            if (!confirm("Giám đốc có chắc chắn muốn xóa bài hát này khỏi hệ thống?")) return;
            
            try {
                const response = await fetch(`http://thucpham111-001-site1.stempurl.com/api/admin/songs/${songId}`, { 
                    method: 'DELETE' 
                });
                
                if (response.ok) {
                    alert("Đã xóa bài hát thành công!");
                    location.reload(); // F5 lại trang
                } else {
                    alert("Có lỗi phía Server khi xóa!");
                }
            } catch (err) {
                alert("Lỗi kết nối!");
            }
        }
        // 3. CÁC HÀM XỬ LÝ FORM POPUP
        function openAddModal() {
            document.getElementById('addSongModal').style.display = 'flex';
        }

        function closeAddModal() {
            document.getElementById('addSongModal').style.display = 'none';
            document.getElementById('addSongForm').reset(); // Xóa trắng form khi đóng
        }

        async function submitNewSong(event) {
            event.preventDefault(); // Ngăn trình duyệt reload lại trang khi bấm Submit

            const title = document.getElementById('newTitle').value;
            const genre = document.getElementById('newGenre').value;
            const audioUrl = document.getElementById('newUrl').value;

            try {
                const response = await fetch('http://thucpham111-001-site1.stempurl.com/api/admin/songs', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    // Đóng gói dữ liệu lại gửi cho C# (Chữ cái đầu viết hoa cho khớp Model)
                    body: JSON.stringify({
                        Title: title,
                        Genre: genre,
                        AudioUrl: audioUrl
                    })
                });

                if (response.ok) {
                    alert("Đã thêm bài hát vào Kho nhạc H2T!");
                    closeAddModal();
                    location.reload(); // F5 lại bảng để thấy bài hát mới luôn
                } else {
                    const error = await response.json();
                    alert("Lỗi từ Server: " + (error.message || "Không thể thêm bài hát."));
                }
            } catch (err) {
                alert("Lỗi kết nối đến Server C#!");
            }
        }
    </script>

            }
        }
    </script>
    <div class="modal-overlay" id="addSongModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeAddModal()"><i class="fas fa-times"></i></button>
            <h2>Thêm Bài Hát Mới</h2>
            <form id="addSongForm" onsubmit="submitNewSong(event)">
                <div class="form-group">
                    <label>Tên bài hát</label>
                    <input type="text" id="newTitle" placeholder="VD: Hãy Trao Cho Anh" required>
                </div>
                <div class="form-group">
                    <label>Thể loại / Ca sĩ</label>
                    <input type="text" id="newGenre" placeholder="VD: Sơn Tùng M-TP" required>
                </div>
                <div class="form-group">
                    <label>Link YouTube (Audio URL)</label>
                    <input type="text" id="newUrl" placeholder="VD: https://youtube.com/watch?v=..." required>
                </div>
                <button type="submit" class="btn-submit">Lưu Bài Hát</button>
            </form>
        </div>
    </div>
</body>
</html>
